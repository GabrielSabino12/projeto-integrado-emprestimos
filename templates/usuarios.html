{% extends "base.html" %}{% block conteudo %}
<div class="card"><h2>Cadastro de usuário</h2>
<form method="post"><label>Nome</label><input name="nome"><label>Matrícula</label><input name="matricula">
<label>Tipo</label><select name="tipo"><option>Aluno</option><option>Professor</option><option>Funcionario</option></select>
<label>Telefone</label><input name="telefone"><button>Cadastrar</button></form></div>
<div class="card"><h2>Usuários cadastrados</h2><table><tr><th>ID</th><th>Nome</th><th>Matrícula</th><th>Tipo</th></tr>
{% for u in lista %}<tr><td>{{ u.id_usuario }}</td><td>{{ u.nome }}</td><td>{{ u.matricula }}</td><td>{{ u.tipo }}</td></tr>
{% else %}<tr><td colspan="4">Nenhum usuário cadastrado.</td></tr>{% endfor %}</table></div>{% endblock %}
